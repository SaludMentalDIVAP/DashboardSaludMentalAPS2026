<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Test carga JSON</title></head>
<body style="font-family:monospace;padding:20px;background:#1a1a2e;color:#eee">
<h2>🔍 Test de carga datos_2026.json</h2>
<div id="resultado" style="background:#000;padding:20px;border-radius:8px;margin-top:20px;white-space:pre-wrap;font-size:13px">Cargando...</div>
<script>
const log = (msg, color='#0f0') => {
  document.getElementById('resultado').innerHTML += 
    '<span style="color:'+color+'">'+msg+'</span>\n';
};

document.getElementById('resultado').innerHTML = '';

fetch('datos_2026.json')
  .then(r => {
    log('✓ fetch OK — status: ' + r.status);
    return r.json();
  })
  .then(pkg => {
    log('✓ JSON parseado OK');
    log('  Claves: ' + Object.keys(pkg).join(', '));
    log('  SS: ' + (pkg.ss ? pkg.ss.length : 'N/A'));
    log('  Meses: ' + JSON.stringify(pkg.meses));
    log('  Rows: ' + (pkg.rows ? pkg.rows.length : 'N/A'));
    if(pkg.rows && pkg.rows.length > 0) {
      const r = pkg.rows[0];
      log('  Primera fila largo: ' + r.length);
      log('  id: ' + r[0]);
      log('  nombre: ' + r[1]);
      log('  r[24] (pbc): ' + r[24]);
      log('  r[55] (pci): ' + r[55]);
      log('  r[56] (piv): ' + r[56]);
      log('  r[57..74] (ei): ' + JSON.stringify(r.slice(57,75)));
      log('  r[75..92] (ee): ' + JSON.stringify(r.slice(75,93)));
      log('  r[93] (cat): ' + JSON.stringify(r[93]));
    }
    log('\n✅ JSON CARGADO CORRECTAMENTE', '#0f0');
  })
  .catch(e => {
    log('❌ ERROR: ' + e.message, '#f44');
    log('Stack: ' + e.stack, '#f88');
  });
</script>
</body>
</html>
